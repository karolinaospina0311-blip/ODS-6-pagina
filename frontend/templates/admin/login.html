{% extends "admin/base.html" %}
{% block titulo %}Ingresar{% endblock %}
{% block contenido %}
<div class="login-card">
  <h1>Ingresar al panel</h1>
  <p>Acceso solo para el personal de la empresa de servicios públicos.</p>
  <form method="post" class="form-eco">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <label class="campo">
      <span>Usuario</span>
      <input type="text" name="usuario" autocomplete="username" required autofocus>
    </label>
    <label class="campo">
      <span>Contraseña</span>
      <input type="password" name="password" autocomplete="current-password" required>
    </label>
    <button type="submit" class="btn btn-solid">Ingresar</button>
  </form>
</div>
{% endblock %}
